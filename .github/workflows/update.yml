name: update-offers

# ::ILANG[TYPE:workflow][PROJECT:travelpromohub]
# 每 6 小时跑一次：抓官方优惠 -> 渲染静态站 -> 提交 site/ 与 data/ -> 部署到 Cloudflare Pages。
# 数据只在代码仓库里改；要加/减厂商、改文案，都改 .ilang/site.ilang 然后推上来。
on:
  schedule:
    - cron: "0 */6 * * *"   # 与 .ilang/site.ilang 的 update_cron 保持一致
  workflow_dispatch:        # 允许手动触发一次

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape official offers
        run: python scraper.py

      - name: Build static site
        run: python build.py

      - name: Commit refreshed data + site
        continue-on-error: true
        run: |
          git config user.name "travelpromohub-bot"
          git config user.email "bot@travelpromohub.pages.dev"
          git add data/offers.json site/
          git diff --cached --quiet || git commit -m "chore: refresh offers $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiKey: ${{ secrets.CF_API_KEY }}
          email: ${{ secrets.CF_EMAIL }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy site --project-name travelpromohub --branch main

      - name: Purge Cloudflare Pages edge cache
        # 部署后清一次边缘缓存，确保被撤下 / 更新的页面不会因边缘缓存（默认最长 7 天）在线上残留。
        # 用 Global Key (X-Auth-Email + X-Auth-Key) 调用 DELETE .../purge_cache。
        continue-on-error: true
        run: |
          curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/travelpromohub/purge_cache" \
            -H "X-Auth-Email: ${{ secrets.CF_EMAIL }}" \
            -H "X-Auth-Key: ${{ secrets.CF_API_KEY }}" \
            -H "Accept: application/json" -w "\npurge_http:%{http_code}\n" || echo "purge skipped"
