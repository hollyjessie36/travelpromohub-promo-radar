name: update-offers

# ::ILANG[TYPE:workflow][PROJECT:travelpromohub-site]
# Every 6 hours: scrape official offers -> render the static site -> commit
# site/ + data/ -> deploy to Cloudflare Pages.
#
# NOTE ON CACHE / WITHDRAWN PAGES
# Cloudflare Pages deploys do NOT purge the edge cache, and there is no public
# purge API for Pages projects (POST/DELETE .../pages/projects/<p>/purge_cache
# is NOT a real endpoint — the path is ignored, so a DELETE there deletes the
# whole project). Withdrawn offers are therefore guarded in code by
# functions/deals/[slug].js, which returns a real 404 at the edge before the
# static-asset cache is consulted. Do NOT re-add a curl "purge" step here.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape official offers
        run: python scraper.py

      - name: Build static site
        run: python build.py

      - name: Commit refreshed data + site
        continue-on-error: true
        run: |
          git config user.name "travelpromohub-bot"
          git config user.email "bot@travelpromohub-site.pages.dev"
          git add data/offers.json site/
          git diff --cached --quiet || git commit -m "chore: refresh offers $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push

      - name: Install wrangler
        run: npm install -g wrangler@3.78.12

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy site/ --project-name travelpromohub-site --commit-dirty=true
