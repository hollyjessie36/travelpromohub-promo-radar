name: update-offers

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape official offers
        run: python scraper.py

      - name: Build static site
        run: python build.py

      - name: Commit refreshed data + site
        continue-on-error: true
        run: |
          git config user.name "travelpromohub-bot"
          git config user.email "bot@travelpromohub-site.pages.dev"
          git add data/offers.json site/
          git diff --cached --quiet || git commit -m "chore: refresh offers $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push

      - name: Install wrangler
        run: npm install -g wrangler@3.78.12

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy site/ --project-name travelpromohub-site --commit-dirty=true

      - name: Purge Cloudflare Pages edge cache
        continue-on-error: true
        run: |
          curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/travelpromohub-site/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Accept: application/json" -w "\npurge_http:%{http_code}\n" || echo "purge skipped"
