name: test-no-cf
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper.py
      - run: python build.py
      - run: |
          git config user.name "travelpromohub-bot"
          git config user.email "bot@travelpromohub.pages.dev"
          git add data/offers.json site/
          git diff --cached --quiet || git commit -m "test: no cf ops"
          git pull --rebase origin main
          git push
        continue-on-error: true
